function clean(raw){
 if(!raw||raw.version!==1)throw Error('نسخة غير مدعومة');
 const base=fresh(),validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||''),s=x=>typeof x==='string'?x:'';

 base.following=Array.isArray(raw.following)?[...new Set(raw.following.filter(x=>byId(x)))]:base.following;
 base.saved=Array.isArray(raw.saved)?raw.saved.filter(x=>typeof x==='string').slice(0,1000):[];
 base.logs=Array.isArray(raw.logs)?raw.logs.filter(x=>x&&s(x.id)&&validDate(x.day)&&byId(x.world)).slice(-10000).map(x=>({id:s(x.id).slice(0,120),world:x.world,day:x.day,title:s(x.title).slice(0,220)})):[];
 base.notes=Array.isArray(raw.notes)?raw.notes.filter(x=>x&&s(x.text)&&validDate(x.day)).slice(-2000).map(x=>({id:s(x.id).slice(0,100),world:byId(x.world)?x.world:'character',day:x.day,text:s(x.text).slice(0,4000)})):[];
 base.custom=Array.isArray(raw.custom)?raw.custom.filter(x=>x&&byId(x.world)&&safeURL(x.url)&&s(x.title)).slice(0,300).map((x,i)=>({id:s(x.id).replace(/[^a-z0-9_-]/gi,'').slice(0,80)||'custom'+i,world:x.world,title:s(x.title).slice(0,100),url:safeURL(x.url),type:['فيديو','كتاب','درس','أداة','وثائقي'].includes(x.type)?x.type:'درس',lang:['ar','en','mix'].includes(x.lang)?x.lang:'ar',author:'إضافتي',desc:'مصدر أضفته إلى رحلتك.'})):[];

function drawLab(){
 if(!$('#labCanvas'))return;const v=labValues[labMode];let body='',stats=[];
 const grid='<path d="M40 25V230H590M40 180H590M40 130H590M40 80H590M150 25V230M260 25V230M370 25V230M480 25V230M590 25V230" stroke="#e2e9e3" fill="none"/>';
 const poly=points=>'<polyline points="'+points.map(p=>p.map(x=>x.toFixed(2)).join(',')).join(' ')+'" fill="none" stroke="#4d8972" stroke-width="3" stroke-linejoin="round"/>';
 if(labMode==='math'){
  const f=x=>(x-3)**2+2,X=x=>40+(x+6)/15*550,Y=y=>230-y/125*205;
  body=grid+poly(Array.from({length:101},(_,i)=>{const x=-6+i*.15;return[X(x),Y(f(x))]}));
  let x=v.x;for(let i=0;i<12;i++){const nx=x-v.rate*2*(x-3);body+='<path d="M'+X(x)+' '+Y(f(x))+'L'+X(nx)+' '+Y(f(nx))+'" stroke="#b99c62" stroke-width="1.3" opacity=".7"/><circle cx="'+X(x)+'" cy="'+Y(f(x))+'" r="'+(i===0?6:3.5)+'" fill="'+(i===0?'#b99c62':'#8875c1')+'"/>';x=nx}
  body+='<circle cx="'+X(3)+'" cy="'+Y(2)+'" r="5" fill="#24685b"/><text x="352" y="255" fill="#7a8e7d" font-size="12">x</text><text x="48" y="20" fill="#7a8e7d" font-size="12">f(x)</text>';
  stats=[['x بعد 12 خطوة',x.toFixed(3)],['القيمة المستهدفة','x = 3']];
 }else if(labMode==='circuit'){
  const tau=v.r*v.c*.001,vol=t=>5*(1-Math.exp(-t/tau));body=grid+poly(Array.from({length:201},(_,i)=>[40+i/200*550,230-vol(i/20)/5*200]));
  body+='<path d="M95 25v205" stroke="#b99c62" stroke-dasharray="4 4"/><circle cx="95" cy="'+(230-vol(1)/5*200)+'" r="6" fill="#b99c62"/><text x="44" y="20" fill="#708577" font-size="12">5 V</text><text x="40" y="253" fill="#708577" font-size="12">0 s</text><text x="567" y="253" fill="#708577" font-size="12">10 s</text>';
  stats=[['الثابت الزمني τ',(tau).toFixed(2)+' s'],['الجهد عند ثانية واحدة',vol(1).toFixed(2)+' V']];
 }else if(labMode==='physics'){
  const a=v.a*Math.PI/180,T=2*v.v*Math.sin(a)/9.81,R=v.v**2*Math.sin(2*a)/9.81,H=(v.v*Math.sin(a))**2/19.62,xmax=Math.max(12,R*1.1),ymax=Math.max(10,H*1.25);
  body=grid+poly(Array.from({length:121},(_,i)=>{const t=T*i/120;return[40+v.v*Math.cos(a)*t/xmax*550,230-(v.v*Math.sin(a)*t-4.905*t*t)/ymax*195]}));
  body+='<text x="45" y="20" fill="#708577" font-size="12">'+ymax.toFixed(0)+' m</text><text x="540" y="253" fill="#708577" font-size="12">'+xmax.toFixed(0)+' m</text>';
  stats=[['المدى الأفقي',R.toFixed(2)+' m'],['زمن التحليق',T.toFixed(2)+' s']];
 }else{
  const total=100+v.water,concentration=100/total,h=25+total/1000*150;
  body='<path d="M185 30v185q0 15 15 15h200q15 0 15-15V30" stroke="#8ca18b" fill="none" stroke-width="3"/><path d="M187 '+(230-h)+'H413V214q0 14-14 14H201q-14 0-14-14z" fill="#6a9b7d" opacity="'+(.12+concentration*.8)+'"/><path d="M187 '+(230-h)+'H413" stroke="#6a9b7d" stroke-width="2"/><text x="245" y="260" font-size="13" fill="#708577">'+total+' mL</text>'+Array.from({length:12},(_,i)=>'<circle cx="'+(210+(i%4)*55)+'" cy="'+(230-h*.2-Math.floor(i/4)*h*.27)+'" r="4" fill="#528c73"/>').join('');
  stats=[['التركيز النهائي',concentration.toFixed(3)+' mol/L'],['كمية المذاب الثابتة','0.100 mol']];
 }
 $('#labCanvas').innerHTML='<svg viewBox="0 0 630 280" role="img" aria-label="رسم يتغيّر حسب القيم المدخلة">'+body+'</svg>';
 $('#labStats').innerHTML=stats.map(([t,v])=>'<div><small>'+t+'</small><strong>'+v+'</strong></div>').join('');
}

 const file=e.target.files[0];if(!file)return;try{if(file.size>3e6)throw Error('الملف أكبر من 3MB');const next=clean(JSON.parse(await file.text()));pendingImport=next;const d=$('#noteModal');d.innerHTML='<div class="dialoghead"><div class="grow"><h2 id="noteTitle">استعادة رحلتك</h2><p>راجع النسخة قبل استبدال تقدّمك الحالي.</p></div><button class="iconbtn" data-action="closeNote" aria-label="إغلاق">'+icon('close',18)+'</button></div><div class="settingsbody"><div class="notice">'+esc(next.name)+' · '+next.logs.length+' خطوات · '+next.notes.length+' أفكار</div><p class="hint">ستحل النسخة محل التقدّم الحالي على هذا المتصفح. يمكنك تصدير الحالية أولًا.</p><div class="row wrap" style="margin-top:18px"><button class="btn primary" data-action="confirmImport">استبدل واستورد</button><button class="btn outline" data-action="export">تصدير الحالية</button><button class="btn soft" data-action="closeNote">إلغاء</button></div></div>';d.showModal()}catch(err){toast('تعذّر الاستيراد. اختر ملف تصدير مَدار صالحًا.')}finally{e.target.value=''}
});
for(const d of $$('dialog'))d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}});
$('#brandmark').innerHTML=icon('orbit',28);$('#mobilemark').innerHTML=icon('orbit',27);$('#searchicon').innerHTML=icon('search',19);$('#settingsicon').innerHTML=icon('settings',18);
$('#date').textContent=new Intl.DateTimeFormat('ar',{timeZone:'Asia/Jerusalem',weekday:'long',day:'numeric',month:'long'}).format(new Date());
render();
</script>
