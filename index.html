function norm(s){return String(s||'').normalize('NFKD').replace(/\p{M}/gu,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).toLowerCase().replace(/ايمن السويد/g,'ايمن سويد').replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ')}
function queryTokens(q){const stop=new Set(['كيف','لماذا','ما','ماذا','هل','هو','هي','عن','في','من','الي','علي','اريد','فيديو','فيديوهات','درس','دروس','سوره','شرح','يتحدث','بالفيديو','تعمل','يعمل','معني','يعني','مثلا','مم','يتالف','عندما','هنالك','هناك','اكثر','نسمع','متزايده','بوجود']);return norm(q).split(' ').filter(x=>x&&!stop.has(x))}

function handleLabAction(a,b){

 if(a==='evMode'){if(['drive','regen','charge'].includes(b.dataset.id)){labValues.ev.mode=b.dataset.id;render()}return true}
 if(a==='evVehicle'){if(['bev','phev'].includes(b.dataset.id)){labValues.ev.vehicle=b.dataset.id;render()}return true}
 if(a==='computerPart'){if(computerParts[b.dataset.id]){labValues.computer.part=b.dataset.id;labValues.computer.stage=0;render()}return true}

}
